```html
<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="utf-8">
    <title>Redes de Esgoto - Macapá</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <link rel="stylesheet"
          href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">

    <style>
        html, body, #map {
            margin: 0;
            padding: 0;
            height: 100%;
            width: 100%;
        }
    </style>
</head>
<body>

<div id="map"></div>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>

<script>
    // Inicializa o mapa em Macapá
    var map = L.map('map').setView([0.0355, -51.0705], 13);

    // Fundo de satélite
    L.tileLayer(
        'https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}',
        {
            maxZoom: 20,
            subdomains: ['mt0', 'mt1', 'mt2', 'mt3']
        }
    ).addTo(map);

    // Redes de esgoto e cores
    var redesEsgoto = [
        {
            arquivo: 'eee1.geojson',
            nome: '🔴 Rede EEE 1',
            cor: '#ff3333'
        },
        {
            arquivo: 'eee2.geojson',
            nome: '🟣 Rede EEE 2',
            cor: '#b347ff'
        },
        {
            arquivo: 'eee3.geojson',
            nome: '🟡 Rede EEE 3',
            cor: '#ffd633'
        },
        {
            arquivo: 'eee7.geojson',
            nome: '🟢 Rede EEE 7',
            cor: '#00cc66'
        },
        {
            arquivo: 'laguinho.geojson',
            nome: '🟣 Rede Laguinho',
            cor: '#ff3399'
        },
        {
            arquivo: 'nelsondosanjos.geojson',
            nome: '🟠 Rede Nelson dos Anjos',
            cor: '#ff8c00'
        },
        {
            arquivo: 'pedrinhas.geojson',
            nome: '🟤 Rede Pedrinhas',
            cor: '#a66b3f'
        }
    ];

    var controleCamadas = {};
    var carregamentosConcluidos = 0;
    var limitesRedes = [];

    function concluirCarregamento() {
        carregamentosConcluidos++;

        if (carregamentosConcluidos === redesEsgoto.length) {
            L.control.layers(
                null,
                controleCamadas,
                { collapsed: false }
            ).addTo(map);

            // Ajusta o mapa para mostrar as redes que carregaram
            if (limitesRedes.length > 0) {
                var grupo = L.featureGroup(limitesRedes);
                var limites = grupo.getBounds();

                if (limites.isValid()) {
                    map.fitBounds(limites, { padding: [20, 20] });
                }
            }
        }
    }

    function carregarRede(rede) {
        fetch(rede.arquivo)
            .then(function (response) {
                if (!response.ok) {
                    throw new Error(
                        'Não foi possível carregar ' + rede.arquivo +
                        ' (HTTP ' + response.status + ')'
                    );
                }

                return response.json();
            })
            .then(function (dados) {
                var camada = L.geoJSON(dados, {
                    style: function () {
                        return {
                            color: rede.cor,
                            weight: 3,
                            opacity: 0.9
                        };
                    }
                });

                // Registra no painel e inicia a rede visível
                controleCamadas[rede.nome] = camada;
                camada.addTo(map);

                if (camada.getLayers().length > 0) {
                    limitesRedes.push(camada);
                }

                console.log('Rede carregada:', rede.nome);
            })
            .catch(function (erro) {
                console.error('Erro na rede ' + rede.nome + ':', erro);
            })
            .finally(concluirCarregamento);
    }

    redesEsgoto.forEach(carregarRede);

</script>
</body>
</html>
