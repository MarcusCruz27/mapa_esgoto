<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Rede de Esgoto - Macapá</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Biblioteca de Mapas Leaflet -->
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    <style>
        body, html { margin: 0; padding: 0; height: 100%; width: 100%; }
        #map { height: 100%; width: 100%; }
        
        .leaflet-control-locate {
            background-color: white;
            padding: 5px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 4px;
            box-shadow: 0 1px 5px rgba(0,0,0,0.65);
        }
    </style>
</head>
<body>
    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    <script>
        // Centraliza o mapa inicialmente em Macapá-AP
        var map = L.map('map').setView([0.0355, -51.0705], 13);

        // Camada de Satélite de fundo (Google Maps)
        var satelite = L.tileLayer('https://{s}.google.com/vt/lyrs=s&x={x}&y={y}&z={z}', {
            maxZoom: 20,
            subdomains: ['mt0','mt1','mt2','mt3']
        }).addTo(map);

        // Objeto que vai armazenar as camadas para o controle do painel lateral
        var overlayLayers = {};

        // Variável de controle para sabermos quando todas as 7 redes terminaram de carregar
        var arquivosCarregados = 0;
        var controlLayers = null;

        function adicionarCamadaAoPainel(nomeAmigavel, camadaGeoJSON) {
            overlayLayers[nomeAmigavel] = camadaGeoJSON;
            arquivosCarregados++;

            // Quando o último arquivo carregar, adiciona o painel de controle no mapa
            if (arquivosCarregados === 7 && !controlLayers) {
                controlLayers = L.control.layers(null, overlayLayers, {collapsed: false}).addTo(map);
            }
        }

        function carregarRede(arquivo, nomeCamada, corHex) {
            fetch(arquivo)
                .then(response => {
                    if (!response.ok) throw new Error("Erro ao carregar " + arquivo);
                    return response.json();
                })
                .then(data => {
                    var camada = L.geoJSON(data, {
                        style: {
                            color: corHex,
                            weight: 3,
                            opacity: 0.9
                        }
                    }).addTo(map); // Já inicia visível no mapa

                    adicionarCamadaAoPainel(nomeCamada, camada);
                })
                .catch(error => {
                    console.log("Aviso: ", error);
                    arquivosCarregados++; // Evita travar se algum arquivo falhar
                });
        }

        // Carrega os 7 arquivos com seus respectivos nomes amigáveis e cores
        carregarRede('eee1.geojson', '🔴 Rede EEE 1', '#ff4d4d');
        carregarRede('eee2.geojson', '🔵 Rede EEE 2', '#3388ff');
        carregarRede('eee3.geojson', '🟡 Rede EEE 3', '#ffcc00');
        carregarRede('eee7.geojson', '🟢 Rede EEE 7', '#00ffcc');
        carregarRede('laguinho.geojson', '🌸 Rede Laguinho', '#ff3399');
        carregarRede('nelsondosanjos.geojson', '🟣 Rede Nelson dos Anjos', '#9933ff');
        carregarRede('pedrinhas.geojson', '🟤 Rede Pedrinhas', '#33cc33');

        // --- GPS / LOCALIZAÇÃO DO USUÁRIO ---
        map.locate({setView: true, maxZoom: 16, watch: true, enableHighAccuracy: true});

        var markerLocal, circleLocal;

        function onLocationFound(e) {
            var radius = e.accuracy / 2;
            if (markerLocal) {
                markerLocal.setLatLng(e.latlng);
                circleLocal.setLatLng(e.latlng);
                circleLocal.setRadius(radius);
            } else {
                markerLocal = L.marker(e.latlng).addTo(map)
                    .bindPopup("<b>Você está aqui</b>").openPopup();
                circleLocal = L.circle(e.latlng, radius).addTo(map);
            }
        }
        map.on('locationfound', onLocationFound);

        function onLocationError(e) {
            alert("Não foi possível acessar sua localização via GPS.");
        }
        map.on('locationerror', onLocationError);
    </script>
</body>
</html>
